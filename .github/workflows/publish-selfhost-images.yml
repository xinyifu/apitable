name: Publish self-host Docker images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag, for example selfhost-20260622-1"
        required: true
        type: string
      allow_overwrite:
        description: "Allow overwriting an existing GHCR image tag"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "selfhost-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-selfhost-images
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/xinyifu
  PLATFORM: linux/amd64
  UPSTREAM_IMAGE_TAG: latest

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      cache_scope: ${{ steps.meta.outputs.cache_scope }}
    steps:
      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${{ inputs.image_tag }}"
          fi

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: ${image_tag}" >&2
            exit 1
          fi

          cache_scope="${GITHUB_REF_NAME:-manual}"
          cache_scope="$(echo "${cache_scope}" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')"

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "cache_scope=${cache_scope}" >> "${GITHUB_OUTPUT}"

  guard_release_tag:
    name: Guard release tag
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image tag availability
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          ALLOW_OVERWRITE: ${{ github.event.inputs.allow_overwrite || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${ALLOW_OVERWRITE}" == "true" ]]; then
            echo "Existing GHCR tags may be overwritten for this manual run."
            exit 0
          fi

          images=(
            backend-server
            room-server
            web-server
            init-db
            init-selfhost-overrides
            openresty
            databus-server
            imageproxy-server
            init-appdata
          )

          existing=()
          for image in "${images[@]}"; do
            ref="${IMAGE_REGISTRY}/apitable/${image}:${IMAGE_TAG}"
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              existing+=("${ref}")
            fi
          done

          if ((${#existing[@]})); then
            printf 'Refusing to overwrite existing image tags:\n' >&2
            printf '  %s\n' "${existing[@]}" >&2
            exit 1
          fi

  build_fork_image:
    name: Build fork image (${{ matrix.image }})
    needs:
      - resolve
      - guard_release_tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend-server
            image: backend-server
          - target: room-server
            image: room-server
          - target: web-server
            image: web-server
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          SEMVER_FULL: ${{ needs.resolve.outputs.image_tag }}
          CACHE_REGISTRY: ghcr.io/xinyifu/apitable/build-cache
          CACHE_SCOPE: ${{ needs.resolve.outputs.cache_scope }}
          BAKE_TARGET: ${{ matrix.target }}
          IMAGE_NAME: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail

          build_created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          image_ref="${IMAGE_REGISTRY}/apitable/${IMAGE_NAME}:${IMAGE_TAG}"

          docker buildx bake --push --provenance=mode=min --sbom=false \
            --set "${BAKE_TARGET}.platform=${PLATFORM}" \
            --set "${BAKE_TARGET}.args.SEMVER_FULL=${IMAGE_TAG}" \
            --set "${BAKE_TARGET}.cache-from=type=registry,ref=${CACHE_REGISTRY}:${BAKE_TARGET}-${CACHE_SCOPE}" \
            --set "${BAKE_TARGET}.cache-to=type=registry,ref=${CACHE_REGISTRY}:${BAKE_TARGET}-${CACHE_SCOPE},mode=max" \
            --set "${BAKE_TARGET}.labels.org.opencontainers.image.created=${build_created}" \
            --set "${BAKE_TARGET}.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set "${BAKE_TARGET}.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --set "${BAKE_TARGET}.labels.org.opencontainers.image.title=apitable/${IMAGE_NAME}" \
            --set "${BAKE_TARGET}.labels.org.opencontainers.image.version=${IMAGE_TAG}" \
            --set "${BAKE_TARGET}.tags=${image_ref}" \
            "${BAKE_TARGET}"

          target_digest="$(docker buildx imagetools inspect "${image_ref}" | awk '/Digest:/ {print $2; exit}')"

          {
            echo "### Built ${IMAGE_NAME}"
            echo
            echo "| Item | Digest |"
            echo "| --- | --- |"
            echo "| Target | \`${image_ref}@${target_digest}\` |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

  build_light_images:
    name: Build light fork images
    needs:
      - resolve
      - guard_release_tag
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push light images
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          SEMVER_FULL: ${{ needs.resolve.outputs.image_tag }}
          CACHE_REGISTRY: ghcr.io/xinyifu/apitable/build-cache
          CACHE_SCOPE: ${{ needs.resolve.outputs.cache_scope }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A targets=(
            [init-db]=init-db
            [init-selfhost-overrides]=init-selfhost-overrides
            [openresty]=openresty
          )

          for target in "${!targets[@]}"; do
            image="${targets[$target]}"
            build_created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            image_ref="${IMAGE_REGISTRY}/apitable/${image}:${IMAGE_TAG}"

            docker buildx bake --push --provenance=mode=min --sbom=false \
              --set "${target}.platform=${PLATFORM}" \
              --set "${target}.args.SEMVER_FULL=${IMAGE_TAG}" \
              --set "${target}.cache-from=type=registry,ref=${CACHE_REGISTRY}:${target}-${CACHE_SCOPE}" \
              --set "${target}.cache-to=type=registry,ref=${CACHE_REGISTRY}:${target}-${CACHE_SCOPE},mode=max" \
              --set "${target}.labels.org.opencontainers.image.created=${build_created}" \
              --set "${target}.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
              --set "${target}.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --set "${target}.labels.org.opencontainers.image.title=apitable/${image}" \
              --set "${target}.labels.org.opencontainers.image.version=${IMAGE_TAG}" \
              --set "${target}.tags=${image_ref}" \
              "${target}"

            target_digest="$(docker buildx imagetools inspect "${image_ref}" | awk '/Digest:/ {print $2; exit}')"

            {
              echo "### Built ${image}"
              echo
              echo "| Item | Digest |"
              echo "| --- | --- |"
              echo "| Target | \`${image_ref}@${target_digest}\` |"
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          done

  mirror_upstream_image:
    name: Mirror upstream image (${{ matrix.image }})
    needs:
      - resolve
      - guard_release_tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - databus-server
          - imageproxy-server
          - init-appdata
    steps:
      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy upstream image ${{ matrix.image }}
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_NAME: ${{ matrix.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          source="docker://docker.io/apitable/${IMAGE_NAME}:${UPSTREAM_IMAGE_TAG}"
          target="docker://${IMAGE_REGISTRY}/apitable/${IMAGE_NAME}:${IMAGE_TAG}"
          target_ref="${IMAGE_REGISTRY}/apitable/${IMAGE_NAME}:${IMAGE_TAG}"

          source_digest="$(skopeo inspect --override-os linux --override-arch amd64 --format '{{.Digest}}' "${source}")"
          skopeo copy \
            --override-os linux \
            --override-arch amd64 \
            --dest-creds "${GHCR_USERNAME}:${GHCR_TOKEN}" \
            "${source}" \
            "${target}"
          target_digest="$(skopeo inspect --creds "${GHCR_USERNAME}:${GHCR_TOKEN}" --format '{{.Digest}}' "${target}")"

          {
            echo "### Mirrored ${IMAGE_NAME}"
            echo
            echo "| Item | Digest |"
            echo "| --- | --- |"
            echo "| Source | \`${source_digest}\` |"
            echo "| Target | \`${target_ref}@${target_digest}\` |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_summary:
    name: Publish summary
    needs:
      - resolve
      - guard_release_tag
      - build_fork_image
      - build_light_images
      - mirror_upstream_image
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Write self-host release summary
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          TAG_GUARD_RESULT: ${{ needs.guard_release_tag.result }}
          BUILD_RESULT: ${{ needs.build_fork_image.result }}
          LIGHT_BUILD_RESULT: ${{ needs.build_light_images.result }}
          MIRROR_RESULT: ${{ needs.mirror_upstream_image.result }}
        shell: bash
        run: |
          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          ## Self-host release images

          | Item | Value |
          | --- | --- |
          | Image tag | \`${IMAGE_TAG}\` |
          | Registry | \`ghcr.io/xinyifu\` |
          | Platform | \`${PLATFORM}\` |
          | Tag guard | \`${TAG_GUARD_RESULT}\` |
          | Heavy fork image build | \`${BUILD_RESULT}\` |
          | Light fork image build | \`${LIGHT_BUILD_RESULT}\` |
          | Upstream image mirror | \`${MIRROR_RESULT}\` |

          ## Published image groups

          | Image | Source |
          | --- | --- |
          | \`backend-server\` | fork build |
          | \`room-server\` | fork build |
          | \`web-server\` | fork build |
          | \`init-db\` | fork build |
          | \`init-selfhost-overrides\` | fork build |
          | \`openresty\` | fork build |
          | \`databus-server\` | upstream mirror |
          | \`imageproxy-server\` | upstream mirror |
          | \`init-appdata\` | upstream mirror |

          ## Deployment note

          Use the matching self-host config for this tag. This release requires \`init-selfhost-overrides\` to run after \`init-appdata\`.

          ## Upgrade command reference

          \`\`\`powershell
          docker compose --env-file .env -f docker-compose.yaml pull
          docker compose --env-file .env -f docker-compose.yaml down
          docker compose --env-file .env -f docker-compose.yaml up -d
          docker compose --env-file .env -f docker-compose.yaml ps
          \`\`\`

          EOF

      - name: Fail summary when publish failed
        if: ${{ needs.guard_release_tag.result != 'success' || needs.build_fork_image.result != 'success' || needs.build_light_images.result != 'success' || needs.mirror_upstream_image.result != 'success' }}
        run: exit 1
