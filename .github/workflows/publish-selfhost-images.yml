name: Publish self-host Docker images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag, for example selfhost-20260622-1"
        required: true
        type: string
  push:
    tags:
      - "selfhost-*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/xinyifu
  PLATFORM: linux/amd64
  UPSTREAM_IMAGE_TAG: latest

jobs:
  publish:
    name: Publish self-host images
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${{ inputs.image_tag }}"
          fi

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: ${image_tag}" >&2
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push fork images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          SEMVER_FULL: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker buildx bake --push \
            --set "*.platform=${PLATFORM}" \
            --set "backend-server.tags=${IMAGE_REGISTRY}/apitable/backend-server:${IMAGE_TAG}" \
            --set "room-server.tags=${IMAGE_REGISTRY}/apitable/room-server:${IMAGE_TAG}" \
            --set "web-server.tags=${IMAGE_REGISTRY}/apitable/web-server:${IMAGE_TAG}" \
            --set "init-db.tags=${IMAGE_REGISTRY}/apitable/init-db:${IMAGE_TAG}" \
            --set "openresty.tags=${IMAGE_REGISTRY}/apitable/openresty:${IMAGE_TAG}" \
            backend-server room-server web-server init-db openresty

      - name: Mirror upstream runtime images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          images=(
            databus-server
            imageproxy-server
            init-appdata
          )

          for image in "${images[@]}"; do
            source="docker.io/apitable/${image}:${UPSTREAM_IMAGE_TAG}"
            target="${IMAGE_REGISTRY}/apitable/${image}:${IMAGE_TAG}"

            docker pull --platform "${PLATFORM}" "${source}"
            docker tag "${source}" "${target}"
            docker push "${target}"
          done

      - name: Print Synology image settings
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          ## Synology .env image settings

          \`\`\`env
          IMAGE_REGISTRY=ghcr.io/xinyifu
          IMAGE_BACKEND_SERVER=apitable/backend-server:${IMAGE_TAG}
          IMAGE_GATEWAY=apitable/openresty:${IMAGE_TAG}
          IMAGE_INIT_DB=apitable/init-db:${IMAGE_TAG}
          IMAGE_ROOM_SERVER=apitable/room-server:${IMAGE_TAG}
          IMAGE_WEB_SERVER=apitable/web-server:${IMAGE_TAG}
          IMAGE_DATABUS_SERVER=apitable/databus-server:${IMAGE_TAG}
          IMAGE_IMAGEPROXY_SERVER=apitable/imageproxy-server:${IMAGE_TAG}
          IMAGE_INIT_APPDATA=apitable/init-appdata:${IMAGE_TAG}

          FIELD_PERMISSION_VISIBLE=true
          FILE_PERMISSION_VISIBLE=true
          SPACE_PERMISSION_OVERVIEW_VISIBLE=true
          SPACE_ROLE_VISIBLE=true
          \`\`\`
          EOF
